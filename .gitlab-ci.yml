stages:
  - build
  - deploy
  - test

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:1.0 .
    - docker push $CI_REGISTRY_IMAGE:1.0

deploy_to_prod:
  stage: deploy
  script:
    - echo "Deploying image..."

check_availability:
  stage: test
  script:
    - echo "Checking service..."
